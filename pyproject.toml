[project]
name = "mtsdisteval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeffrey", email = "ulricmen@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "arch>=5.3.1",
    "cython>=3.0.10",
    "einops>=0.8.2",
    "gdown>=6.5.1",
    "grailts>=0.1.0",
    "h5py>=3.16.0",
    "hmmlearn>=0.3.3",
    "hurst>=0.0.5",
    "kmedoids>=0.5.5",
    "matplotlib>=3.7.5",
    "networkx>=3.1",
    "numba>=0.68.1",
    "numpy>=1.24.3,<2.0",
    "pandas>=2.0.3",
    "rocket-fft>=0.3.3",
    "scikit-learn>=1.3.2",
    "scikit-posthocs>=0.17.1",
    "sktime==0.35.0",
    "stumpy>=1.12.0",
    "torch==2.3.0",
    "torchinfo>=1.8.0",
    "tqdm>=4.70.1",
    "transformers>=4.38.0",
    "tsfresh>=0.21.2",
    "tslearn>=0.6.3",
]

[project.scripts]
mtsdisteval = "mtsdisteval:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.6.2",
]
